{% set name = "seabirdscientific" %}
{% set version = "2.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/seabirdscientific-{{ version }}.tar.gz
  sha256: bd59199970064ad3880d4edafab367219aa6d781513de28fac3a4f77e4afe4a2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - pip
  run:
    - python >={{ python_min }}
    - gsw >=3.6.20,<3.7.dev0
    - matplotlib-base >=3.9.4,<3.10.dev0
    - numpy >=2.0.2,<2.1.dev0
    - pandas >=2.3.3,<2.4.dev0
    - plotly >=6.3.1,<6.4.dev0
    - scipy >=1.13.1,<1.14.dev0
