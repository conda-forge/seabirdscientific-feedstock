{% set name = "seabirdscientific" %}
{% set version = "2.7.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/seabirdscientific-{{ version }}.tar.gz
  sha256: 840e259dc49418313c0ce88eeec12172a2b36a544b380bf733211a265a8d3766

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - pip
  run:
    - python >={{ python_min }}
    - gsw ~=3.6.20
    - matplotlib-base ~=3.9.4
    - numpy ~=2.0.2
    - pandas ~=2.3.3
    - plotly ~=6.3.1
    - scipy ~=1.13.1
