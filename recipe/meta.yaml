{% set name = "seabirdscientific" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/seabirdscientific-{{ version }}.tar.gz
  sha256: b9b724bfabedf6a3edd26b484b0199ffc59ff01c0eca098cbeb04710d0fd29d4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - pip
  run:
    - seawater >=3.3.3
    - xarray >=2024.10.0
    - python >={{ python_min }}
    - gsw >=3.6.18
    - matplotlib-base >=3.10.0
    - numpy >=2.2.0
    - pandas >=2.3.0
    - plotly >=6.0.0
    - scipy >=1.15.0
